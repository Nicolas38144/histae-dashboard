map $request_method $histae_log_method {
    default other;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}

map $uri $histae_log_route {
    default page;
    /api/auth/admob/webhook admob-webhook;
    /api/auth/sweego/webhook sweego-webhook;
    /api/billing/stripe/webhook stripe-webhook;
    ~^/api(?:/|$) api;
    ~^/health(?:/|$) health;
    ~^/(?:assets|_next)(?:/|$) asset;
}

# API response IDs are canonical UUIDs. Ignore arbitrary upstream header text.
map $upstream_http_x_request_id $histae_log_request_id {
    default "";
    "~*^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" $upstream_http_x_request_id;
}

log_format histae_safe escape=json
    '{"time":"$time_iso8601","method":"$histae_log_method",'
    '"route":"$histae_log_route","status":$status,'
    '"duration":"$request_time","request_id":"$histae_log_request_id"}';
