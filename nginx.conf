# Ce fichier est un template pour l'image officielle Nginx, inclus dans http {}.
# Le conteneur doit être accessible uniquement par le tunnel / proxy de confiance.
map $http_x_forwarded_proto $histae_forwarded_proto {
    default $scheme;
    https https;
}

map $histae_forwarded_proto $histae_hsts {
    default "";
    https "max-age=31536000; includeSubDomains";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security $histae_hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Santé du serveur statique ; ne dépend pas de la disponibilité de l'API.
    location = /healthz {
        access_log off;
        return 204;
    }

    location = /api {
        return 404;
    }

    # Le préfixe /api et les paramètres sont conservés. Une réponse API n'est
    # jamais remplacée par index.html, même en cas d'erreur.
    location ^~ /api/ {
        # DNS embarqué Docker : résout les services Docker et les domaines distants.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $histae_api_upstream "${HISTAE_API_UPSTREAM}";
        proxy_pass $histae_api_upstream;
        proxy_http_version 1.1;
        # Host cible le serveur API (utile pour son proxy et ses virtual hosts).
        # L'origine publique du dashboard reste dans Origin / X-Forwarded-Host.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $histae_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # Pour une origine HTTPS : SNI et vérification du certificat de l'API.
        # Ces directives ne changent pas les connexions HTTP du réseau interne.
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
    }

    # Les fichiers locaux et les sources ne sont jamais servis par le repli SPA.
    location ~ (^|/)\. {
        return 404;
    }

    location ~ ^/(?:src|tests|node_modules)(?:/|$) {
        return 404;
    }

    location ~* \.(?:map|ts|tsx|jsx)$ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Un fichier absent doit donner une 404, pas une page HTML avec un statut 200.
    location ~ /[^/]+\.[^/]+$ {
        try_files $uri =404;
    }

    # React Router : /login, /users/... et les autres routes chargent la SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
